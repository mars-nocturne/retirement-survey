<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>退職金リアル調査</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;700&family=BIZ+UDGothic:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #1a1a2e;
    --paper: #f5f0e8;
    --accent: #c0392b;
    --gold: #d4a853;
    --muted: #7a7a8a;
    --card-bg: #ffffff;
    --border: #d8d0c4;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--paper);
    color: var(--ink);
    font-family: 'BIZ UDGothic', sans-serif;
    min-height: 100vh;
  }

  /* Background texture */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      repeating-linear-gradient(0deg, transparent, transparent 39px, rgba(0,0,0,0.04) 39px, rgba(0,0,0,0.04) 40px),
      repeating-linear-gradient(90deg, transparent, transparent 39px, rgba(0,0,0,0.02) 39px, rgba(0,0,0,0.02) 40px);
    pointer-events: none;
    z-index: 0;
  }

  .wrap { position: relative; z-index: 1; max-width: 900px; margin: 0 auto; padding: 0 16px 60px; }

  /* Header */
  header {
    padding: 36px 0 28px;
    border-bottom: 3px double var(--border);
    margin-bottom: 32px;
    display: flex;
    align-items: flex-end;
    gap: 16px;
  }
  .header-mark {
    width: 48px; height: 48px;
    background: var(--accent);
    display: flex; align-items: center; justify-content: center;
    font-family: 'Noto Serif JP', serif;
    color: #fff;
    font-size: 22px;
    font-weight: 700;
    flex-shrink: 0;
    box-shadow: 3px 3px 0 var(--gold);
  }
  .header-text h1 {
    font-family: 'Noto Serif JP', serif;
    font-size: 26px;
    font-weight: 700;
    letter-spacing: 0.06em;
    line-height: 1.2;
  }
  .header-text p {
    font-size: 12px;
    color: var(--muted);
    margin-top: 4px;
    letter-spacing: 0.08em;
  }

  /* Stats bar */
  .stats-bar {
    display: flex;
    gap: 12px;
    margin-bottom: 28px;
    flex-wrap: wrap;
  }
  .stat-item {
    background: var(--card-bg);
    border: 1px solid var(--border);
    padding: 12px 20px;
    flex: 1; min-width: 130px;
    text-align: center;
    box-shadow: 2px 2px 0 var(--border);
  }
  .stat-num {
    font-family: 'Noto Serif JP', serif;
    font-size: 24px;
    font-weight: 700;
    color: var(--accent);
  }
  .stat-label { font-size: 11px; color: var(--muted); margin-top: 2px; letter-spacing: 0.06em; }

  /* Filter bar */
  .filter-bar {
    display: flex;
    gap: 8px;
    margin-bottom: 24px;
    flex-wrap: wrap;
    align-items: center;
  }
  .filter-label { font-size: 12px; color: var(--muted); font-weight: 700; letter-spacing: 0.06em; }
  .filter-btn {
    background: none;
    border: 1px solid var(--border);
    padding: 6px 14px;
    font-size: 12px;
    font-family: 'BIZ UDGothic', sans-serif;
    cursor: pointer;
    color: var(--ink);
    transition: all 0.15s;
    letter-spacing: 0.04em;
  }
  .filter-btn:hover, .filter-btn.active {
    background: var(--ink);
    color: #fff;
    border-color: var(--ink);
  }

  /* Cards */
  .cards { display: flex; flex-direction: column; gap: 16px; }

  .card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    padding: 20px 24px;
    box-shadow: 3px 3px 0 var(--border);
    animation: fadeIn 0.3s ease;
  }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

  .card-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 12px;
    gap: 12px;
  }
  .card-tags { display: flex; gap: 6px; flex-wrap: wrap; }
  .tag {
    font-size: 11px;
    padding: 3px 8px;
    letter-spacing: 0.04em;
    font-weight: 700;
  }
  .tag-company { background: #e8f0fe; color: #1a56c4; border: 1px solid #b3c9f7; font-size: 12px; }
  .tag-industry { background: var(--ink); color: #fff; }
  .tag-type { background: var(--gold); color: var(--ink); }
  .tag-years { background: none; border: 1px solid var(--muted); color: var(--muted); }

  .card-amount {
    font-family: 'Noto Serif JP', serif;
    font-size: 28px;
    font-weight: 700;
    color: var(--accent);
    white-space: nowrap;
  }
  .card-amount span { font-size: 13px; color: var(--muted); font-family: 'BIZ UDGothic', sans-serif; }

  .card-details {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
    gap: 8px;
    margin-bottom: 12px;
    font-size: 12px;
    color: var(--muted);
    border-top: 1px dashed var(--border);
    padding-top: 12px;
  }
  .detail-item strong { color: var(--ink); }

  .card-comment {
    font-size: 13px;
    line-height: 1.7;
    color: #3a3a4a;
    border-left: 3px solid var(--gold);
    padding-left: 12px;
    margin-top: 10px;
  }

  /* Submit section */
  .submit-section {
    margin-top: 40px;
    border: 2px dashed var(--border);
    padding: 28px;
    background: rgba(255,255,255,0.6);
  }
  .submit-section h2 {
    font-family: 'Noto Serif JP', serif;
    font-size: 18px;
    margin-bottom: 6px;
  }
  .submit-section p { font-size: 12px; color: var(--muted); margin-bottom: 20px; }

  .form-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
    margin-bottom: 14px;
  }
  @media (max-width: 540px) { .form-grid { grid-template-columns: 1fr; } }

  .form-group { display: flex; flex-direction: column; gap: 5px; }
  .form-group label { font-size: 11px; font-weight: 700; color: var(--muted); letter-spacing: 0.06em; }
  .form-group input, .form-group select, .form-group textarea {
    border: 1px solid var(--border);
    padding: 8px 10px;
    font-size: 13px;
    font-family: 'BIZ UDGothic', sans-serif;
    background: var(--paper);
    color: var(--ink);
    outline: none;
    transition: border-color 0.15s;
  }
  .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
    border-color: var(--ink);
  }
  .form-group textarea { resize: vertical; min-height: 70px; }
  .form-full { grid-column: 1 / -1; }

  .submit-btn {
    background: var(--ink);
    color: #fff;
    border: none;
    padding: 12px 32px;
    font-size: 14px;
    font-family: 'BIZ UDGothic', sans-serif;
    font-weight: 700;
    cursor: pointer;
    letter-spacing: 0.08em;
    box-shadow: 3px 3px 0 var(--accent);
    transition: all 0.15s;
  }
  .submit-btn:hover { transform: translate(-1px, -1px); box-shadow: 4px 4px 0 var(--accent); }
  .submit-btn:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--accent); }

  .success-msg {
    display: none;
    background: #e8f5e9;
    border: 1px solid #4caf50;
    padding: 10px 16px;
    font-size: 13px;
    color: #2e7d32;
    margin-top: 12px;
  }

  .no-results {
    text-align: center;
    padding: 48px;
    color: var(--muted);
    font-size: 14px;
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="header-mark">退</div>
    <div class="header-text">
      <h1>退職金リアル調査</h1>
      <p>実際にもらった人たちの声をまとめたデータベース &nbsp;🔗 <span style="color:var(--accent);font-weight:700;">投稿はみんなで共有</span></p>
    </div>
  </header>

  <a href="fukugyo.html" style="display:inline-block;font-size:12px;color:var(--muted);text-decoration:none;margin-bottom:20px;border-bottom:1px dotted var(--muted);">副業OK？NG？リアル調査へ →</a>

  <div class="stats-bar" id="statsBar">
    <div class="stat-item"><div class="stat-num" id="totalCount">0</div><div class="stat-label">件の回答</div></div>
    <div class="stat-item"><div class="stat-num" id="avgAmount">―</div><div class="stat-label">平均退職金</div></div>
    <div class="stat-item"><div class="stat-num" id="maxAmount">―</div><div class="stat-label">最高額</div></div>
    <div class="stat-item"><div class="stat-num" id="avgYears">―</div><div class="stat-label">平均勤続年数</div></div>
  </div>

  <div class="filter-bar">
    <span class="filter-label">絞り込み：</span>
    <button class="filter-btn active" data-filter="all">すべて</button>
    <button class="filter-btn" data-filter="製造業">製造業</button>
    <button class="filter-btn" data-filter="IT・通信">IT・通信</button>
    <button class="filter-btn" data-filter="金融・保険">金融・保険</button>
    <button class="filter-btn" data-filter="医療・福祉">医療・福祉</button>
    <button class="filter-btn" data-filter="公務員">公務員</button>
    <button class="filter-btn" data-filter="その他">その他</button>
  </div>

  <div id="gasBanner" style="display:none;border:1px solid;padding:8px 16px;font-size:12px;margin-bottom:16px;"></div>

  <div class="cards" id="cardsContainer" style="display:none"></div>
  <div id="loadingMsg" style="text-align:center;padding:48px;color:var(--muted);font-size:14px;">データを読み込み中…</div>

  <div class="submit-section">
    <h2>あなたの退職金を投稿する</h2>
    <p>投稿内容はこのアプリを使う全員と共有されます。企業名・金額は正確に記入してください。</p>
    <div class="form-grid">
      <div class="form-group form-full">
        <label>企業名（必須）</label>
        <input type="text" id="f-company" placeholder="例: トヨタ自動車、〇〇市役所、△△病院">
      </div>
      <div class="form-group">
        <label>業種</label>
        <select id="f-industry">
          <option value="">選んでください</option>
          <option>製造業（自動車・機械）</option>
          <option>製造業（電気・電子）</option>
          <option>製造業（化学・素材）</option>
          <option>製造業（食品・飲料）</option>
          <option>IT・ソフトウェア</option>
          <option>通信・インターネット</option>
          <option>金融・銀行</option>
          <option>保険</option>
          <option>証券・投資</option>
          <option>医療・病院</option>
          <option>福祉・介護</option>
          <option>製薬・医療機器</option>
          <option>教育・学校</option>
          <option>国家公務員</option>
          <option>地方公務員</option>
          <option>建設・ゼネコン</option>
          <option>不動産</option>
          <option>小売・百貨店</option>
          <option>流通・物流</option>
          <option>飲食・外食</option>
          <option>宿泊・ホテル</option>
          <option>マスコミ・出版・広告</option>
          <option>エネルギー・電力・ガス</option>
          <option>運輸・鉄道・航空</option>
          <option>コンサルティング</option>
          <option>人材・派遣</option>
          <option>その他</option>
        </select>
      </div>
      <div class="form-group">
        <label>職種</label>
        <select id="f-occupation">
          <option value="">選んでください</option>
          <option>営業・販売</option>
          <option>企画・マーケティング</option>
          <option>経営・管理職</option>
          <option>経理・財務</option>
          <option>人事・総務・法務</option>
          <option>エンジニア・開発</option>
          <option>研究・開発（R&D）</option>
          <option>生産・製造・品質管理</option>
          <option>医師・看護師・医療職</option>
          <option>福祉・介護職</option>
          <option>教員・教育職</option>
          <option>公務員・行政職</option>
          <option>事務・アシスタント</option>
          <option>物流・配送</option>
          <option>クリエイティブ・デザイン</option>
          <option>その他</option>
        </select>
      </div>
      <div class="form-group">
        <label>退職理由</label>
        <select id="f-type">
          <option value="">選んでください</option>
          <option>定年退職</option>
          <option>自己都合退職</option>
          <option>会社都合退職</option>
          <option>早期退職</option>
          <option>転職</option>
        </select>
      </div>
      <div class="form-group">
        <label>勤続年数</label>
        <input type="number" id="f-years" placeholder="例: 25" min="1" max="50">
      </div>
      <div class="form-group">
        <label>退職時の年齢</label>
        <input type="number" id="f-age" placeholder="例: 60" min="20" max="75">
      </div>
      <div class="form-group">
        <label>退職金額（万円）</label>
        <input type="number" id="f-amount" placeholder="例: 1200" min="0">

      </div>
      <div class="form-group">
        <label>社員数（退職時）</label>
        <select id="f-headcount">
          <option value="">選んでください</option>
          <option>〜29人</option>
          <option>30〜99人</option>

          <option>1000〜4999人</option>
          <option>5000人以上</option>

      </div>
      <div class="form-group">
        <label>退職金制度の種類</label>
        <select id="f-scheme">
          <option value="">選んでください／不明</option>
          <option>確定給付型（DB）</option>
          <option>確定拠出型（DC・iDeCo企業版）</option>
          <option>中小企業退職金共済（中退共）</option>
          <option>自社積立型</option>
          <option>複数併用</option>
          <option>不明</option>
        </select>
      </div>
      <div class="form-group">
        <label>退職金規定の開示</label>
        <select id="f-disclosure">
          <option value="">選んでください</option>
          <option>入社前に開示されていた</option>
          <option>入社後すぐに確認できた</option>
          <option>申請すれば見られた</option>
          <option>なかなか見せてもらえなかった</option>
          <option>最後まで不明だった</option>
        </select>
      </div>
      <div class="form-group">
        <label>退職金への満足度</label>
        <select id="f-satisfaction">
          <option value="">選んでください</option>
          <option>★★★★★ 非常に満足</option>
          <option>★★★★☆ 満足</option>
          <option>★★★☆☆ 普通</option>
          <option>★★☆☆☆ やや不満</option>
          <option>★☆☆☆☆ 不満</option>
        </select>
      </div>
      <div class="form-group">
        <label>退職時の最終年収（万円）</label>

      <div class="form-group form-full">

      </div>
    </div>
    <button class="submit-btn" onclick="submitEntry()">投稿する</button>
    <div class="success-msg" id="successMsg">✓ 投稿しました。ありがとうございます！</div>
  </div>

</div>

<script>
// ======================================================
// スプレッドシート連携用のURLをデプロイ後に貼り付けてください
// ======================================================
const GAS_URL = 'https://script.google.com/macros/s/AKfycbw5_s0Sfkz5SYKE7T_dETWsgGlmj0zTG-hKXdiavlgtHBq0Cu_4fl1BqQvFgRfWYahO/exec';

const seedData = [
  { id: 'seed1', company: '国土交通省', industry: '公務員', type: '定年退職', years: 38, age: 60, amount: 2480, position: '係長', comment: '国家公務員です。退職金が大きいと聞いていましたが、実際にもらってみると思ったより多かったです。ただ民間の同期と比べると給与は低かったので、トータルでは普通かも。', ts: 1 },
  { id: 'seed2', company: 'トヨタ自動車', industry: '製造業', type: '定年退職', years: 36, age: 60, amount: 1980, position: '部長', comment: '定年延長も選べましたが、退職金が減るため定年で辞めました。老後の資金として助かります。', ts: 2 },
  { id: 'seed3', company: 'フューチャーアーキテクト', industry: 'IT・通信', type: '転職', years: 8, age: 34, amount: 180, position: '一般社員', comment: '中小のIT企業です。8年で180万円。退職金制度はあるものの、額が小さいので期待しすぎない方がいいかも。', ts: 3 },
  { id: 'seed4', company: '三菱UFJ銀行', industry: '金融・保険', type: '定年退職', years: 37, age: 60, amount: 2750, position: '支店長', comment: '役職が高いほど退職金も多くなる仕組みです。ただ最近は制度が変わり、若い世代はもらえる額が減っているようです。', ts: 4 },
  { id: 'seed5', company: '東京都立病院機構', industry: '医療・福祉', type: '自己都合退職', years: 15, age: 42, amount: 350, position: '看護師', comment: '公立病院の看護師です。15年で350万円。体力的にきつくなってきたので転職しました。思っていたよりはもらえました。', ts: 5 },
  { id: 'seed6', company: '日立製作所', industry: '製造業', type: '早期退職', years: 22, age: 48, amount: 1100, position: '主任', comment: '希望退職募集に応じました。割増退職金があり、通常より500万円ほど多く受け取れました。早期退職制度はチェックする価値あります。', ts: 6 },
  { id: 'seed7', company: 'NTTデータ', industry: 'IT・通信', type: '会社都合退職', years: 12, age: 45, amount: 580, position: 'マネージャー', comment: '会社が買収されて部門閉鎖になりました。会社都合なので割増あり。転職活動の間、助かりました。', ts: 7 },
  { id: 'seed8', company: 'イオンリテール', industry: 'その他', type: '定年退職', years: 40, age: 65, amount: 800, position: '店長', comment: '小売チェーンの店長として40年働きました。大企業ではないので退職金は少なめです。でも健康で働き続けられたことに感謝しています。', ts: 8 },
];

let allData = [];
let currentFilter = 'all';
let gasReady = false;

// ── スプレッドシート連携 ──────────────────────────
async function loadFromSheet() {
  if (!GAS_URL || GAS_URL === 'ここにデプロイURLを貼り付け') {
    allData = [...seedData];
    applyFilter();
    setLoading(false);
    showBanner('⚠️ スプレッドシート未接続 — サンプルデータを表示中', 'warn');
    return;
  }
  try {
    const res = await fetch(GAS_URL + '?action=get');
    const json = await res.json();
    if (json.status === 'ok') {
      const map = new Map();
      [...seedData, ...json.data].forEach(d => map.set(d.id, d));
      allData = [...map.values()].sort((a, b) => (b.ts || 0) - (a.ts || 0));
      gasReady = true;
      showBanner('✅ スプレッドシートと接続中', 'ok');
    } else {
      throw new Error(json.message);
    }
  } catch (err) {
    allData = [...seedData];
    showBanner('⚠️ スプレッドシート読み込み失敗 — サンプルデータを表示中', 'warn');
  }
  applyFilter();
  setLoading(false);
}

async function postToSheet(entry) {
  if (!gasReady) return;
  await fetch(GAS_URL + '?action=post&body=' + encodeURIComponent(JSON.stringify(entry)));
}

// ── UI ────────────────────────────────
function showBanner(msg, type) {
  const el = document.getElementById('gasBanner');
  el.textContent = msg;
  el.style.display = 'block';
  el.style.background = type === 'ok' ? '#e8f5e9' : '#fff8e1';
  el.style.borderColor = type === 'ok' ? '#4caf50' : '#ffc107';
  el.style.color = type === 'ok' ? '#2e7d32' : '#7a5c00';
}

function setLoading(on) {
  document.getElementById('loadingMsg').style.display = on ? 'block' : 'none';
  document.getElementById('cardsContainer').style.display = on ? 'none' : 'flex';
}

function formatAmount(man) {
  if (man >= 10000) return (man / 10000).toFixed(1) + '億円';
  return man.toLocaleString() + '万円';
}

function renderCards(data) {
  const container = document.getElementById('cardsContainer');
  if (data.length === 0) {
    container.innerHTML = '<div class="no-results">該当するデータがありません</div>';
    return;
  }
  container.innerHTML = data.map(d => `
    <div class="card">
      <div class="card-header">
        <div class="card-tags">
          <span class="tag tag-company">🏢 ${d.company || '企業名非公開'}</span>
          <span class="tag tag-industry">${d.industry}</span>
          ${d.occupation ? `<span class="tag tag-type">${d.occupation}</span>` : ''}
          <span class="tag tag-years">勤続${d.years}年</span>
          ${d.age ? `<span class="tag tag-years">${d.age}歳</span>` : ''}
          ${d.satisfaction ? `<span class="tag tag-years">${d.satisfaction.substring(0,6)}</span>` : ''}
        </div>
        <div class="card-amount">${formatAmount(d.amount)}<span>（税引前）</span></div>
      </div>
      <div class="card-details">
        <div class="detail-item">企業名：<strong>${d.company || '非公開'}</strong></div>
        <div class="detail-item">役職：<strong>${d.position || '非公開'}</strong></div>
        <div class="detail-item">勤続：<strong>${d.years}年</strong></div>
        <div class="detail-item">年齢：<strong>${d.age ? d.age + '歳' : '非公開'}</strong></div>
        <div class="detail-item">退職理由：<strong>${d.type}</strong></div>
        ${d.headcount ? `<div class="detail-item">社員数：<strong>${d.headcount}</strong></div>` : ''}
        ${d.salary ? `<div class="detail-item">最終年収：<strong>${d.salary.toLocaleString()}万円</strong></div>` : ''}
        ${d.scheme ? `<div class="detail-item">制度種類：<strong>${d.scheme}</strong></div>` : ''}
        ${d.disclosure ? `<div class="detail-item">規定開示：<strong>${d.disclosure}</strong></div>` : ''}
      </div>
      ${d.comment ? `<div class="card-comment">${d.comment}</div>` : ''}
    </div>
  `).join('');
}

function updateStats(data) {
  document.getElementById('totalCount').textContent = data.length;
  if (data.length === 0) {
    document.getElementById('avgAmount').textContent = '―';
    document.getElementById('maxAmount').textContent = '―';
    document.getElementById('avgYears').textContent = '―';
    return;
  }
  const amounts = data.map(d => d.amount);
  const avg = Math.round(amounts.reduce((a,b) => a+b, 0) / amounts.length);
  const max = Math.max(...amounts);
  const avgYears = Math.round(data.map(d => d.years).reduce((a,b) => a+b, 0) / data.length);
  document.getElementById('avgAmount').textContent = avg.toLocaleString() + '万';
  document.getElementById('maxAmount').textContent = max.toLocaleString() + '万';
  document.getElementById('avgYears').textContent = avgYears + '年';
}

function applyFilter() {
  const filtered = currentFilter === 'all' ? allData : allData.filter(d => d.industry === currentFilter);
  renderCards(filtered);
  updateStats(filtered);
}

document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentFilter = btn.dataset.filter;
    applyFilter();
  });
});

async function submitEntry() {
  const company      = document.getElementById('f-company').value.trim();
  const industry     = document.getElementById('f-industry').value;
  const occupation   = document.getElementById('f-occupation').value;
  const type         = document.getElementById('f-type').value;
  const years        = parseInt(document.getElementById('f-years').value);
  const age          = parseInt(document.getElementById('f-age').value) || null;
  const amount       = parseInt(document.getElementById('f-amount').value);
  const position     = document.getElementById('f-position').value || '非公開';
  const headcount    = document.getElementById('f-headcount').value;
  const scheme       = document.getElementById('f-scheme').value;
  const disclosure   = document.getElementById('f-disclosure').value;
  const satisfaction = document.getElementById('f-satisfaction').value;
  const salary       = parseInt(document.getElementById('f-salary').value) || null;
  const comment      = document.getElementById('f-comment').value;

  if (!company || !industry || !type || !years || !amount) {
    alert('企業名、業種、退職理由、勤続年数、退職金額は必須です。');
    return;
  }

  const btn = document.querySelector('.submit-btn');
  btn.disabled = true;
  btn.textContent = '保存中…';

  const entry = { id: 'u' + Date.now(), company, industry, occupation, type, years, age, amount, position, headcount, scheme, disclosure, satisfaction, salary, comment, ts: Date.now() };

  await postToSheet(entry);
  allData.unshift(entry);
  applyFilter();

  btn.disabled = false;
  btn.textContent = '投稿する';

  ['f-company','f-industry','f-occupation','f-type','f-years','f-age','f-amount','f-position','f-headcount','f-scheme','f-disclosure','f-satisfaction','f-salary','f-comment'].forEach(id => {
    document.getElementById(id).value = '';
  });
  const msg = document.getElementById('successMsg');
  msg.style.display = 'block';
  setTimeout(() => msg.style.display = 'none', 3000);
}

// Initial load
setLoading(true);
loadFromSheet();
</script>
